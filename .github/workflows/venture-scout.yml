name: venture-scout

on:
  schedule:
    # 05:47 Brisbane on Tuesday, Thursday and Sunday (19:47 UTC the day before; Brisbane has no daylight saving).
    # That is every 2 to 3 days; the Sunday run adds the weekly strategic review.
    # Off the hour because GitHub can delay scheduled runs at busy times.
    - cron: "47 19 * * 1,3,6"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Write the email to the run artifact instead of sending it"
        type: boolean
        default: false
      weekly:
        description: "Include the weekly strategic review"
        type: boolean
        default: false
      groups:
        description: "Only these source groups (comma separated, empty = all)"
        type: string
        default: ""

concurrency: venture-scout

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - run: python -m pytest -q

      - name: Run the agents
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="--dry-run"; fi
          if [ "${{ inputs.weekly }}" = "true" ]; then ARGS="$ARGS --weekly"; fi
          if [ -n "${{ inputs.groups }}" ]; then ARGS="$ARGS --groups ${{ inputs.groups }}"; fi
          python run.py $ARGS

      - name: Keep the run output for 14 days
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-output
          path: out/
          retention-days: 14
          if-no-files-found: ignore

      - name: Save history and report (not on dry runs)
        if: ${{ !cancelled() && inputs.dry_run != true }}
        run: |
          git config user.name "venture-scout-agent"
          git config user.email "venture-scout-agent@users.noreply.github.com"
          git add data/venture.db reports/ inbox/
          git commit -m "Run $(TZ=Australia/Brisbane date +%F)" || echo "No changes"
          git pull --rebase origin main
          git push
